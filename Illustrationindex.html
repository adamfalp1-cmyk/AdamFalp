<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {

    width: 900px;

    max-width: 92%;

    margin: 80px auto;

    border: 1px solid white;

    padding: 25px;

}


/* =========================
   GALLERY
========================= */

.gallery {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 30px;

}


/* =========================
   INDIVIDUAL WORK
========================= */

.work {

    position: relative;

    background: #000;

    overflow: hidden;

    cursor: pointer;

}


.work img {

    width: 100%;

    display: block;

    border: 1px solid white;

}


/* =========================
   SLIDING LABEL
========================= */

.label {

    position: absolute;

    left: 1px;

    right: 1px;

    bottom: -80px;

    padding: 15px;

    background: rgba(0, 0, 0, 0.92);

    color: white;

    font-size: 13px;

    line-height: 1.5;

    letter-spacing: 1px;

    transition: bottom 0.3s ease;

}


.work:hover .label {

    bottom: 1px;

}


.label strong {

    font-size: 14px;

}


/* =========================
   BACK BUTTON
========================= */

.back {

    display: block;

    width: 180px;

    margin: 40px auto 0;

    padding: 12px 30px;

    border: 1px solid white;

    color: white;

    background: black;

    text-decoration: none;

    text-align: center;

    font-size: 13px;

    letter-spacing: 3px;

    transition: 0.2s;

}


.back:hover {

    background: white;

    color: black;

}


/* =========================
   LIGHTBOX
========================= */

#lightbox {

    display: none;

    position: fixed;

    z-index: 9999;

    top: 0;

    left: 0;

    width: 100%;

    height: 100%;

    background: rgba(0, 0, 0, 0.96);

    overflow-y: auto;

    padding: 40px;

}


.lightbox-content {

    min-height: 100%;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

}


.lightbox-images {

    display: flex;

    justify-content: center;

    align-items: flex-start;

    gap: 30px;

    max-width: 1200px;

    width: 100%;

}


.lightbox-images img {

    max-width: calc(50% - 15px);

    max-height: 75vh;

    width: auto;

    height: auto;

    display: block;

    border: 1px solid white;

}


/* =========================
   LIGHTBOX TITLE
========================= */

.lightbox-title {

    margin-top: 20px;

    text-align: center;

    font-size: 14px;

    letter-spacing: 2px;

    line-height: 1.6;

}


.lightbox-title strong {

    font-size: 15px;

}


/* =========================
   CLOSE BUTTON
========================= */

.close {

    position: fixed;

    top: 20px;

    right: 30px;

    color: white;

    font-size: 28px;

    font-weight: normal;

    cursor: pointer;

    line-height: 1;

    z-index: 10000;

}


.close:hover {

    color: #cc3333;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .container {

        margin: 30px auto;

        padding: 15px;

    }


    .gallery {

        grid-template-columns: 1fr;

        gap: 25px;

    }


    #lightbox {

        padding: 60px 20px 30px;

    }


    .lightbox-images {

        flex-direction: column;

        align-items: center;

        gap: 20px;

    }


    .lightbox-images img {

        max-width: 100%;

        max-height: none;

    }


    .close {

        top: 20px;

        right: 20px;

    }

}

</style>

</head>

<script>


/* =========================
   REMEMBER SCROLL POSITION
========================= */

let savedScrollPosition = 0;



/* =========================
   OPEN LIGHTBOX
========================= */

function openLightbox(mainImage, secondaryImage, title, year) {


    savedScrollPosition = window.scrollY;


    document.getElementById("lightboxMain").src = mainImage;


    if (secondaryImage) {

        document.getElementById("lightboxSecondary").src = secondaryImage;

        document.getElementById("lightboxSecondary").style.display = "block";

    } else {

        document.getElementById("lightboxSecondary").src = "";

        document.getElementById("lightboxSecondary").style.display = "none";

    }


    document.getElementById("lightboxTitle").innerHTML =
        "<strong>" + title + "</strong><br>" + year;


    document.getElementById("lightbox").style.display = "block";


    document.body.style.overflow = "hidden";

}



/* =========================
   CLOSE LIGHTBOX
========================= */

function closeLightbox() {


    document.getElementById("lightbox").style.display = "none";


    document.body.style.overflow = "";


    window.scrollTo(0, savedScrollPosition);

}



/* =========================
   ESCAPE KEY
========================= */

document.addEventListener("keydown", function(event) {


    if (event.key === "Escape") {

        closeLightbox();

    }


});

</script>
