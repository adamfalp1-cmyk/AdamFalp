<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adam Falp</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}


/* =========================
   MAIN CONTAINER
========================= */

.container {
    width: 700px;
    max-width: 90%;
    margin: 120px auto;

    border: 1px solid white;

    padding: 20px;
}


/* =========================
   TABLE
========================= */

table {
    width: 100%;
}

.image-cell {
    width: 50%;
    text-align: center;
    vertical-align: middle;
}

.menu-cell {
    width: 50%;
    text-align: center;
    vertical-align: middle;
}


/* =========================
   GIF / IMAGE
========================= */

#visual {
    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 400px;
}

#visual img {
    width: 280px;
    max-width: 100%;

    display: block;

    border: 1px solid white;
}


/* =========================
   ABOUT TEXT
========================= */

.about-text {

    padding: 20px;

    font-size: 13px;

    line-height: 1.6;

    text-align: left;

    min-height: 400px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    .email {
    color: #cc3333;

}


/* =========================
   NAVIGATION BUTTONS
========================= */

.menu-button {

    display: block;

    width: 180px;

    margin: 15px auto;

    padding: 10px;

    color: white;

    background: black;

    border: 1px solid white;

    text-decoration: none;

    font-size: 14px;

    letter-spacing: 2px;

    transition: 0.2s;

}


.menu-button:hover {

    background: white;

    color: black;

}


/* =========================
   EMAIL
========================= */

.about-text a {

    color: white;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    .container {

        margin: 40px auto;

    }

    table,
    tr,
    td {

        display: block;

        width: 100%;

    }

    .image-cell {

        margin-bottom: 30px;

    }

    .menu-button {

        width: 200px;

    }

}

</style>

</head>


<body>


<div class="container">


<table cellpadding="10">

<tr>


<!-- =========================
     IMAGE / ABOUT AREA
========================= -->

<td class="image-cell">

<div id="visual">

    <img src="COMIX.jpg" alt="Adam Falp">

</div>

</td>



<!-- =========================
     NAVIGATION
========================= -->

<td class="menu-cell">


<a class="menu-button" href="Illustrationindex.html">
ILLUSTRATION
</a>


<a class="menu-button" href="painting.html">
PAINTING
</a>


<a class="menu-button" href="Comics.html">
COMICS
</a>


<a class="menu-button" href="shop.html">
SHOP
</a>


<a class="menu-button" href="#" id="aboutButton">
ABOUT
</a>


</td>


</tr>

</table>


</div>



<!-- =========================
     ABOUT SCRIPT
========================= -->

<script>

const aboutButton = document.getElementById("aboutButton");

const visual = document.getElementById("visual");


let showingAbout = false;


aboutButton.addEventListener("click", function(event) {

    event.preventDefault();


    if (!showingAbout) {


        visual.innerHTML = `

            <div class="about-text">

                <strong>ADAM FALP</strong>

                Is an Artist, illustrator and cartoonist based in London.

                <br><br>

                His work explores underground culture,
                psychedelia, absurdity and contemporary Britain.
                His comics have appeared in independent and underground 
                publications internationally, alongside his own successful 
                self-published titles including Electric Chair and Smokin’ Bedroom. 
                He is also a contributing artist and editor for Underground Kingdom, 
                an independent British comics collectove bringing together emerging 
                and established UK based cartoonists.

                

                <br><br>

                <a class="email" href="mailto:hello@adamfalp.com">
                hello@adamfalp.com
                </a>

            </div>

        `;


        showingAbout = true;


    } else {


        visual.innerHTML = `

            <img src="intro.gif" alt="Adam Falp">

        `;


        showingAbout = false;

    }

});

</script>


</body>
</html>
